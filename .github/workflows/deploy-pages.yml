name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build publishing output
        id: publish
        run: node tooling/encryption/deploy-build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          NODE_ENV: production
          PROTOTYPE_PUBLISH_MODE: ${{ vars.PROTOTYPE_PUBLISH_MODE || 'encrypted' }}
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publish.outputs.directory }}
      - uses: actions/deploy-pages@v4
        id: deployment
